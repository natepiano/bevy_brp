[package]
edition = "2024"
name    = "bevy_brp_test_apps"
publish = false                # Never publish test apps

# Disable automatic discovery to ensure explicit control
autobins     = false
autoexamples = false

# Binary definitions
[[bin]]
name = "test_app"
path = "src/bin/test_app.rs"

# Example definitions
[[example]]
name = "extras_plugin"
path = "examples/extras_plugin.rs"

[[example]]
name = "no_extras_plugin"
path = "examples/no_extras_plugin.rs"

[[example]]
name = "event_test"
path = "examples/event_test.rs"

[[example]]
name = "mouse_test"
path = "examples/mouse_test.rs"

# Same name as the [[bin]] above — tests that brp_list_bevy distinguishes by kind
[[example]]
name = "test_app"
path = "examples/test_app.rs"


[dependencies]
bevy_brp_extras      = { workspace = true }
bevy_remote          = { workspace = true, default-features = true }
schemars.workspace   = true
serde.workspace      = true
serde_json.workspace = true

# The full default set is required here, not a leftover from before the workspace
# started trimming features. examples/extras_plugin.rs spawns one entity per Bevy
# component so the type-guide and mutation tools have real targets, which reaches
# bevy::gltf, bevy::audio, bevy::animation, bevy::light, bevy::pbr,
# bevy::anti_alias and bevy::world_serialization. Cargo resolves features per
# crate, so a narrower list would break that example, not only the four smaller
# targets beside it. extras, by contrast, resolves to five bevy features.
bevy = { workspace = true, default-features = true }

[lints]
workspace = true

# Exclude from cargo-release
[package.metadata.release]
release = false
