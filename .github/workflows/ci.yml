name: CI

# Combined CI workflow for all testing
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: always
  CARGO_TERM_PROGRESS_WIDTH: 80
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAPLO_VERSION: 0.10.0
  CARGO_DENY_VERSION: 0.19.6

# Cancel duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast format check on one OS
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt -- --check

  taplo:
    name: Taplo Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo@${{ env.TAPLO_VERSION }}

      - name: Check TOML formatting
        run: taplo fmt --check

  # Supply-chain gate: RustSec advisories, license policy, and crate sources.
  # Reads Cargo.lock and cargo metadata only -- nothing is compiled, so this
  # needs neither nix nor mold. Config and its reasoning live in deny.toml.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Check advisories, licenses and sources
        run: cargo deny check

  # Clippy
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install Nix
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache the Nix store
        if: runner.os == 'Linux'
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}

      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Build check
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install Nix
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache the Nix store
        if: runner.os == 'Linux'
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}

      - name: Build release
        run: nix develop -c cargo build --release --all-features --workspace --examples

  # Test suite
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install Nix
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache the Nix store
        if: runner.os == 'Linux'
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Run test targets
        run: nix develop -c cargo nextest run --all-features --workspace --tests
        env:
          # Disable GPU/windowing for headless testing
          WGPU_BACKEND: "gl"
          WINIT_UNIX_BACKEND: "x11"
          # Force mold linker to avoid rust-lld/LLVM crashes on CI runners
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  windows-publication:
    name: Windows Screenshot Publication
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run replacement publication test
        run: >-
          cargo nextest run -p bevy_brp_extras --no-tests fail -- --exact
          screenshot::capture::pending_screenshot_capture::tests::atomic_publication_replaces_existing_and_creates_absent_destinations

  mend:
    name: Mend Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rust-src, rustc-dev, llvm-tools-preview

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install Nix
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache the Nix store
        if: runner.os == 'Linux'
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}

      - name: Install cargo-mend
        run: cargo install cargo-mend
        env:
          RUSTC_BOOTSTRAP: 1

      - name: Run cargo mend
        run: nix develop -c cargo mend --fail-on-warn
        env:
          CARGO_TERM_COLOR: never
